name: Test

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Swift tests
        env:
          TERMEOW_AGENT_INTEGRATION_TESTS: "1"
        run: swift test
      - name: Xcode build and test
        run: |
          xcodebuild test \
            -project Termeow.xcodeproj \
            -scheme Termeow \
            -destination 'platform=macOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
